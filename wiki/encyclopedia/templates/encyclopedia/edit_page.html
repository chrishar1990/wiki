{% extends "encyclopedia/layout.html" %}

<style>
    .my-textarea {
        height: 200px;
        width: 95%;
        resize: vertical;
        box-sizing: border-box;
    }
    
</style>



{% block title %}
    Edit Page
{% endblock %}

{% block body %}
  
        <div>
            <h1>{{title}}</h1>
        </div>
        
  <form action="{% url 'encyclopedia:edit_page' title%}" method="POST">
        {% csrf_token %}
       
        {{ form }} 
        <input type="submit">
   </form>

   
{% endblock %}
